
name: Project CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Run project tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check for Python test suite
        run: |
          if [ ! -f requirements.txt ] && [ ! -f pyproject.toml ]; then
            echo "::error::No Python dependency configuration found."
            exit 1
          fi

          if [ ! -d tests ] && ! find . -maxdepth 1 -type f -name "test_*.py" | grep -q .; then
            echo "::error::No recognized test suite found."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install .
          fi
          pip install pytest

      - name: Run tests
        run: python -m pytest
